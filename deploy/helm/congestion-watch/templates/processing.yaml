apiVersion: v1
kind: ConfigMap
metadata:
  name: processing-config
  namespace: {{ .Values.namespace }}
data:
  KAFKA_BOOTSTRAP: "kafka:9092"
  KAFKA_TOPIC_IN: "traffic.speeds.raw"
  KAFKA_TOPIC_DLQ: "traffic.speeds.dlq"
  KAFKA_TOPIC_WEATHER: "weather.observations.raw"
  SCHEMA_PATH: "/opt/spark-app/schemas/traffic_speed_event.avsc"
  WEATHER_SCHEMA_PATH: "/opt/spark-app/schemas/weather_observation_event.avsc"
  CHECKPOINT_DIR: "/checkpoints"
  MINIO_ENDPOINT: "http://minio:9000"
  BRONZE_TABLE_PATH: "s3a://bronze/traffic_speeds_raw"
  SILVER_TABLE_PATH: "s3a://bronze/traffic_speeds_valid"
  GOLD_TABLE_PATH: "s3a://gold/congestion_scores"
  ANOMALY_STATE_TABLE_PATH: "s3a://gold/anomaly_state"
  STARTING_OFFSETS: {{ .Values.processing.streaming.startingOffsets | quote }}
  MAX_OFFSETS_PER_TRIGGER: {{ .Values.processing.streaming.maxOffsetsPerTrigger | quote }}
  WEATHER_MAX_OFFSETS_PER_TRIGGER: {{ .Values.processing.streaming.weatherMaxOffsetsPerTrigger | quote }}
  ANOMALY_SCORE_THRESHOLD: {{ .Values.processing.streaming.anomalyScoreThreshold | quote }}
  ANOMALY_CONFIRM_WINDOWS: {{ .Values.processing.streaming.anomalyConfirmWindows | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: processing-checkpoints
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.processing.checkpointStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-streaming
  namespace: {{ .Values.namespace }}
  labels:
    app: processing-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-streaming
  template:
    metadata:
      labels:
        app: processing-streaming
      annotations:
        checksum/config: {{ .Values.processing.streaming | toYaml | sha256sum }}
    spec:
      containers:
        - name: processing
          image: {{ .Values.processing.image }}
          envFrom:
            - configMapRef:
                name: processing-config
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
          resources:
            {{- toYaml .Values.processing.resources | nindent 12 }}
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: processing-checkpoints
