apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-config
  namespace: {{ .Values.namespace }}
data:
  # Konfiguration der Serving-API (src/serving/config.py). Die frueheren
  # Schluessel BUCKET_GOLD/MINIO_ENDPOINT liest die API nicht — ohne
  # GOLD_READER blieb sie im Fixture-Modus, also auf erfundenen Zahlen.
  GOLD_READER: "delta"
  DELTA_URI: "s3://gold/congestion_scores"
  BASELINE_URI: "s3://gold/baseline_profile"
  S3_ENDPOINT: "http://minio:9000"
  S3_ALLOW_HTTP: "true"
  S3_REGION: "us-east-1"
  CACHE_TTL_S: "20"
  BASELINE_TTL_S: "900"
  TUMBLING_ONLY: "true"
  DEFAULT_LIMIT: "10"
  MAX_LIMIT: "200"
  LOG_LEVEL: "INFO"
  # UI und API liegen hinter demselben Ingress, der Browser stellt also
  # gleiche-Herkunft-Anfragen und braucht CORS gar nicht. "*" ist trotzdem
  # der Default, weil der Ingress-Host im Chart nicht feststeht. Sobald er es
  # tut, gehoert hier die konkrete Origin hin: seit SCRUM-89 nimmt die API
  # POST entgegen, und "*" heisst, dass jede beliebige Seite im Browser eines
  # Nutzers Events einspeisen koennte.
  CORS_ORIGINS: {{ .Values.serving.corsOrigins | quote }}
  # Einspeisung aus der UI (SCRUM-89): echter Producer gegen dieselbe
  # Schema-Registry wie die Ingestion-Pods.
  INGEST_MODE: "kafka"
  KAFKA_BOOTSTRAP: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  TOPIC: "traffic.speeds.raw"
  DLQ_TOPIC: "traffic.speeds.dlq"
  SCHEMA_PATH: "/app/schemas/traffic_speed_event.avsc"
  WATERMARK_DELAY_S: "120"
  MAX_SCENARIO_MINUTES: "60"
  MAX_EVENTS_PER_MINUTE: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
  namespace: {{ .Values.namespace }}
  labels:
    app: serving-api
spec:
  replicas: {{ .Values.serving.replicas }}
  selector:
    matchLabels:
      app: serving-api
  template:
    metadata:
      labels:
        app: serving-api
    spec:
      # Kubernetes injiziert fuer jeden Service Umgebungsvariablen (KAFKA_PORT,
      # SCHEMA_REGISTRY_PORT, ...). Sie kollidieren zwar aktuell mit keinem
      # unserer Namen, aber die Ingestion ist genau darueber schon einmal
      # gestolpert — dieselbe Absicherung wie dort.
      enableServiceLinks: false
      containers:
        - name: serving-api
          image: {{ .Values.serving.image }}
          ports:
            - containerPort: {{ .Values.serving.port }}
          envFrom:
            - configMapRef:
                name: serving-config
            # Liefert MINIO_ROOT_USER/MINIO_ROOT_PASSWORD; config.py nimmt sie
            # als Fallback fuer S3_ACCESS_KEY/S3_SECRET_KEY entgegen.
            - secretRef:
                name: minio-credentials
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.serving.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.serving.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.serving.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: serving-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: serving-api
  ports:
    - port: 80
      targetPort: {{ .Values.serving.port }}
{{- if .Values.serving.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serving-api
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - {{- if .Values.serving.ingress.host }}
      host: {{ .Values.serving.ingress.host }}
      {{- end }}
      http:
        paths:
          # Nur die API-Pfade. "/" gehoert seit SCRUM-91 der UI — stuende hier
          # weiterhin "/", wuerden sich zwei Ingress-Regeln um dieselbe Wurzel
          # streiten und je nach Auswertung die UI oder die API verschwinden.
          {{- range $path := list "/api" "/docs" "/openapi.json" "/health" "/ready" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  number: 80
          {{- end }}
{{- end }}
