apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-config
  namespace: {{ .Values.namespace }}
data:
  GOLD_READER: "delta"
  DELTA_URI: "s3://gold/congestion_scores"
  BASELINE_URI: "s3://gold/baseline_profile"
  S3_ENDPOINT: "http://minio:9000"
  S3_ALLOW_HTTP: "true"
  S3_REGION: "us-east-1"
  CACHE_TTL_S: "20"
  BASELINE_TTL_S: "900"
  TUMBLING_ONLY: "true"
  DEFAULT_LIMIT: "10"
  MAX_LIMIT: "200"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: {{ .Values.serving.corsOrigins | quote }}
  INGEST_MODE: "kafka"
  KAFKA_BOOTSTRAP: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  TOPIC: "traffic.speeds.raw"
  DLQ_TOPIC: "traffic.speeds.dlq"
  SCHEMA_PATH: "/app/schemas/traffic_speed_event.avsc"
  WATERMARK_DELAY_S: "120"
  MAX_SCENARIO_MINUTES: "60"
  MAX_EVENTS_PER_MINUTE: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
  namespace: {{ .Values.namespace }}
  labels:
    app: serving-api
spec:
  replicas: {{ .Values.serving.replicas }}
  selector:
    matchLabels:
      app: serving-api
  template:
    metadata:
      labels:
        app: serving-api
    spec:
      enableServiceLinks: false
      containers:
        - name: serving-api
          image: {{ .Values.serving.image }}
          ports:
            - containerPort: {{ .Values.serving.port }}
          envFrom:
            - configMapRef:
                name: serving-config
            - secretRef:
                name: minio-credentials
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.serving.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.serving.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.serving.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: serving-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: serving-api
  ports:
    - port: 80
      targetPort: {{ .Values.serving.port }}
{{- if .Values.serving.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serving-api
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - {{- if .Values.serving.ingress.host }}
      host: {{ .Values.serving.ingress.host }}
      {{- end }}
      http:
        paths:
          {{- range $path := list "/api" "/docs" "/openapi.json" "/health" "/ready" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  number: 80
          {{- end }}
{{- end }}
