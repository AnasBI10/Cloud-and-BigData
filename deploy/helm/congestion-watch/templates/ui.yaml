# SCRUM-91 — Web-UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  namespace: {{ .Values.namespace }}
data:
  API_BASE_URL: {{ .Values.ui.apiBaseUrl | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
  labels:
    app: ui
spec:
  # Repliken steuert die HPA am Ende dieser Datei.
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      enableServiceLinks: false
      containers:
        - name: ui
          image: {{ .Values.ui.image }}
          ports:
            - containerPort: {{ .Values.ui.port }}
          envFrom:
            - configMapRef:
                name: ui-config
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.ui.port }} }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.ui.port }} }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: {{ .Values.ui.port }}
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
spec:
  rules:
    - {{- if .Values.ui.ingress.host }}
      host: {{ .Values.ui.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
{{- end }}
---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui
  minReplicas: {{ .Values.ui.hpa.minReplicas }}
  maxReplicas: {{ .Values.ui.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ui.hpa.targetCPUUtilization }}
