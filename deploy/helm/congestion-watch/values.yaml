namespace: bigdata

resourceQuota:
  cpu: "6"
  memory: 12Gi
  pvcs: "15"

storageClass: local-path

minio:
  
  image: quay.io/minio/minio:latest
  mcImage: quay.io/minio/mc:latest
  storage: 5Gi
  user: admin
  password: "CHANGE_ME"
  buckets:
    - bronze
    - gold
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

kafka:
  image: apache/kafka:3.9.0
  replicas: 3
  storage: 1Gi
  topics:
    - name: traffic.speeds.raw
      partitions: 12
      retentionMs: "604800000"
    - name: weather.observations.raw
      partitions: 5
      retentionMs: "604800000"
    - name: traffic.speeds.dlq
      partitions: 3
      retentionMs: "1209600000"
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { memory: 2Gi }

schemaRegistry:
  image: confluentinc/cp-schema-registry:7.6.1
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 250m, memory: 1Gi }

producer:
  image: congestion-watch/ingestion:0.1.4
  synthetic:
    eventsPerSecond: 5
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    hpa:
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilization: 70
  live:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits:   { cpu: 250m, memory: 384Mi }
  weather:
    replicas: 1
    pollIntervalS: 300
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits:   { cpu: 150m, memory: 192Mi }

socrata:
  appToken: "CHANGE_ME"

serving:
  image: congestion-watch/serving:0.2.1
  # Auf die tatsaechliche UI-Origin eingrenzen, sobald der Ingress-Host
  # feststeht (z. B. "http://congestion-watch.example"). Siehe Kommentar in
  # templates/serving.yaml.
  corsOrigins: "*"
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  ingress:
    enabled: true
    host: ""

ui:
  image: congestion-watch/ui:0.1.2
  replicas: 2
  port: 8080
  # Leer = gleiche Herkunft. Nur setzen, wenn die API unter einer anderen
  # Adresse laeuft als die UI (etwa bei getrennten Hosts).
  apiBaseUrl: ""
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 96Mi }
  ingress:
    enabled: true
    host: ""

processing:
  image: congestion-watch/processing:0.9.1
  checkpointStorage: 1Gi
  streaming:
    startingOffsets: latest
    maxOffsetsPerTrigger: 20000
    weatherMaxOffsetsPerTrigger: 2000
    anomalyScoreThreshold: "2.0"
    anomalyConfirmWindows: 3
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: 1, memory: 4Gi }
  # Batch-Lauf fuer das Baseline-Profil, das die Serving-API zum Score braucht.
  # Alle sechs Stunden: die Historie waechst langsam, oefter zu rechnen aendert
  # die Zellen kaum, kostet aber eine CPU aus dem ResourceQuota.
  baseline:
    schedule: "0 */6 * * *"
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 1, memory: 2Gi }
