<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Finale Kappa-Architektur fuer NYC Congestion Watch</title>
<desc>Web-UI und Wetter-Poller speisen Kafka-Topics, abgesichert durch eine Schema-Registry. Spark Structured Streaming filtert ungueltige Status-Werte, joint gegen Wetter und aggregiert in Zeitfenstern. Ergebnisse landen als Delta Lake auf MinIO und werden ueber eine Serving-API an die UI zurueckgegeben. Alles laeuft als Kubernetes-Workloads.</desc>
