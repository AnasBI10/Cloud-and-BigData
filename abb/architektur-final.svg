<line x1="460" y1="112" x2="390" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="154" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="300" y="178" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Kafka</text>
<text x="300" y="197" font-size="12" fill="#0F6E56" text-anchor="middle">Topics traffic, weather</text>

<rect x="460" y="154" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="535" y="178" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Schema-Registry</text>
<text x="535" y="197" font-size="12" fill="#5F5E5A" text-anchor="middle">Avro-Verträge</text>

