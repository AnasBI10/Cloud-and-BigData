<line x1="300" y1="210" x2="300" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="246" width="260" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="300" y="268" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Spark Structured Streaming</text>
<text x="300" y="287" font-size="12" fill="#0F6E56" text-anchor="middle">Statusfilter, Join, Fenster</text>
<text x="300" y="303" font-size="12" fill="#0F6E56" text-anchor="middle">Driver + Executors</text>

