<text x="200" y="99" font-size="12" fill="#993C1D" text-anchor="middle">Deployment, Ingress</text>

<rect x="360" y="56" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="470" y="80" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Wetter-Poller</text>
<text x="470" y="99" font-size="12" fill="#993C1D" text-anchor="middle">Deployment, 5-Min-Takt</text>

