<svg width="880" height="620" viewBox="0 0 880 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Finale Kappa-Architektur fuer NYC Congestion Watch</title>
<desc>Drei Producer (synthetic, live, weather) sowie die Web-UI im Datenlieferant-Modus schreiben nach Kafka. Schema-Registry sichert Avro-Vertraege. Spark Structured Streaming filtert ungueltige Status-Werte, joint gegen den Wetterstrom, aggregiert in Zeitfenstern, fuehrt eine stateful Anomalie-Erkennung und schreibt verspaetete Ereignisse in eine Dead-Letter-Queue. Ein Baseline-CronJob liefert die Broadcast-Baseline. Ergebnisse landen als Delta Lake (Bronze, Silver, Gold, Anomalie-Zustand) auf MinIO und werden ueber eine Serving-API an die UI zurueckgegeben. Alles laeuft als Kubernetes-Workloads.</desc>
