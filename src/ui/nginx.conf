# Statisches Ausliefern des UI-Bundles (SCRUM-91).
#
# Port 8080, nicht 80: der Container laeuft als uid 101 und darf keine
# privilegierten Ports binden. Der Service bildet 80 darauf ab.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Kein Cache. Das Bundle hat keine Hashes in den Dateinamen — ein
    # zwischengespeichertes styles.css oder dashboard.js nach einem Rollout
    # waere im Betrieb nicht als Ursache erkennbar und kostet bei einer
    # Vorfuehrung mehr, als der Cache je einspart. Die Dateien sind zusammen
    # unter 60 kB.
    add_header Cache-Control "no-cache" always;

    gzip              on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Wird beim Containerstart aus der Umgebung erzeugt
    # (docker-entrypoint.d/40-api-base-url.sh). Darf nie aus einem Cache
    # kommen, sonst zeigt die UI nach einem Umzug der API noch auf die alte.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Fuer die Kubernetes-Probes. Bewusst getrennt von / — eine Probe soll
    # nicht bei jedem Aufruf das komplette HTML ausliefern.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
