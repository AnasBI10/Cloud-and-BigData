# SCRUM-79 — Serving-API.
#
# Workload-Typ Deployment, nicht StatefulSet (SCRUM-92): die API haelt keinen
# Zustand, keine Identitaet und kein Volume. Jede Replik kann jede Anfrage
# beantworten, weil der Zustand in der Gold-Schicht liegt. Genau deshalb ist
# sie auch die Komponente, die sich am einfachsten horizontal skalieren
# laesst (SCRUM-93/94).
apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-config
  labels:
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/part-of: nyc-congestion-watch
data:
  # Abgabestand: "delta" liest die echte Gold-Tabelle aus MinIO. "fixture"
  # bleibt als Entwicklungsmodus erhalten, ist aber NICHT der Abgabestand —
  # die Aufgabenstellung verlangt eine real an die Pipeline angebundene UI.
  GOLD_READER: "delta"
  # Pfade wie der Spark-Job sie schreibt (deploy/helm/.../processing.yaml:
  # GOLD_TABLE_PATH). Der Bucket heisst "gold", nicht "congestion-watch".
  DELTA_URI: "s3://gold/congestion_scores"
  # Zweite Tabelle: Erwartungswert und Streuung je Segment x Wochentag x
  # Stunde, geschrieben vom CronJob baseline-profile. Ohne sie laeuft die API
  # weiter, meldet aber jedes Segment als unbewertbar.
  BASELINE_URI: "s3://gold/baseline_profile"
  BASELINE_TTL_S: "900"
  # Der Sink schreibt gleitende Fenster (5 Min Laenge, 1 Min Versatz). Fuer
  # die Zeitreihe im Dashboard nur die nicht ueberlappenden verwenden.
  TUMBLING_ONLY: "true"
  S3_ENDPOINT: "http://minio:9000"
  S3_ALLOW_HTTP: "true"
  S3_REGION: "us-east-1"
  CACHE_TTL_S: "20"
  DEFAULT_LIMIT: "10"
  MAX_LIMIT: "200"
  LOG_LEVEL: "INFO"
  # UI und API teilen sich den Ingress, der Browser braucht CORS also nicht.
  # "*" bleibt, solange kein fester Host existiert — seit SCRUM-89 nimmt die
  # API aber POST entgegen, deshalb hier eingrenzen, sobald moeglich.
  CORS_ORIGINS: "*"
  # --- Einspeisung, Rolle Datenlieferant (SCRUM-89) ---
  # "kafka" ist der Abgabestand: Events aus der UI gehen denselben Weg wie
  # echte DOT-Messungen. "dryrun" protokolliert nur und ist Entwicklungsmodus.
  INGEST_MODE: "kafka"
  KAFKA_BOOTSTRAP: "kafka:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  TOPIC: "traffic.speeds.raw"
  DLQ_TOPIC: "traffic.speeds.dlq"
  SCHEMA_PATH: "/app/schemas/traffic_speed_event.avsc"
  # Muss zu WATERMARK_DELAY im Spark-Job passen (2 Minuten). Aendert sich die
  # Watermark dort, gehoert dieser Wert mit umgestellt — sonst nimmt die API
  # Events an, die der Job anschliessend in die DLQ schiebt.
  WATERMARK_DELAY_S: "120"
  MAX_SCENARIO_MINUTES: "60"
  MAX_EVENTS_PER_MINUTE: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
  labels:
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/part-of: nyc-congestion-watch
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: serving-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving-api
    spec:
      # Gleiche Falle wie bei der Schema-Registry: Kubernetes injiziert fuer
      # jeden Service Umgebungsvariablen, die mit der eigenen Konfiguration
      # kollidieren koennen.
      enableServiceLinks: false
      containers:
        - name: api
          image: congestion-watch/serving:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: serving-config
          env:
            # Das Secret legt SCRUM-78 an. Die Schluessel heissen dort
            # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD (siehe
            # deploy/helm/congestion-watch/templates/minio.yaml) — frueher
            # standen hier access-key/secret-key, die es nie gab: die API
            # bekam keine Zugangsdaten und lief im Delta-Modus in ein 403.
            # optional: true, damit der Fixture-Modus ohne MinIO startet.
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
                  optional: true
          # Liveness prueft nur den Prozess. Waere hier /ready eingetragen,
          # wuerde Kubernetes die Pods dauerhaft neu starten, solange der
          # Spark-Job noch keine Gold-Tabelle geschrieben hat.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness prueft die Gold-Schicht: ohne lesbare Tabelle nimmt der
          # Service den Pod aus dem Endpoint, statt 503 an die UI zu liefern.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: serving-api
  labels:
    app.kubernetes.io/name: serving-api
spec:
  selector:
    app.kubernetes.io/name: serving-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Traefik ist auf dem k3s bereits vorhanden (siehe docs/setup.md), es braucht
# keinen zusaetzlichen Ingress-Controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serving-api
  labels:
    app.kubernetes.io/name: serving-api
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  name: http
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  name: http
