# SCRUM-79 — Serving-API.
#
# Workload-Typ Deployment, nicht StatefulSet (SCRUM-92): die API haelt keinen
# Zustand, keine Identitaet und kein Volume. Jede Replik kann jede Anfrage
# beantworten, weil der Zustand in der Gold-Schicht liegt. Genau deshalb ist
# sie auch die Komponente, die sich am einfachsten horizontal skalieren
# laesst (SCRUM-93/94).
apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-config
  labels:
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/part-of: nyc-congestion-watch
data:
  # ACHTUNG, vor der Abgabe umstellen: "fixture" ist der Entwicklungsmodus,
  # solange MinIO (SCRUM-78) und der Delta-Sink (SCRUM-86) nicht stehen.
  # Der Zielzustand ist "delta" — die Aufgabenstellung verlangt eine real an
  # die Pipeline angebundene UI, kein Mockup.
  GOLD_READER: "fixture"
  DELTA_URI: "s3://congestion-watch/gold/segment_windows"
  S3_ENDPOINT: "http://minio:9000"
  S3_ALLOW_HTTP: "true"
  S3_REGION: "us-east-1"
  CACHE_TTL_S: "20"
  DEFAULT_LIMIT: "10"
  MAX_LIMIT: "200"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
  labels:
    app.kubernetes.io/name: serving-api
    app.kubernetes.io/part-of: nyc-congestion-watch
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: serving-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving-api
    spec:
      # Gleiche Falle wie bei der Schema-Registry: Kubernetes injiziert fuer
      # jeden Service Umgebungsvariablen, die mit der eigenen Konfiguration
      # kollidieren koennen.
      enableServiceLinks: false
      containers:
        - name: api
          image: congestion-watch/serving:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: serving-config
          env:
            # Das Secret legt SCRUM-78 an. Solange es fehlt, startet der Pod
            # nicht — deshalb optional markiert: im Fixture-Modus braucht die
            # API keine MinIO-Zugangsdaten.
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
                  optional: true
          # Liveness prueft nur den Prozess. Waere hier /ready eingetragen,
          # wuerde Kubernetes die Pods dauerhaft neu starten, solange der
          # Spark-Job noch keine Gold-Tabelle geschrieben hat.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness prueft die Gold-Schicht: ohne lesbare Tabelle nimmt der
          # Service den Pod aus dem Endpoint, statt 503 an die UI zu liefern.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: serving-api
  labels:
    app.kubernetes.io/name: serving-api
spec:
  selector:
    app.kubernetes.io/name: serving-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Traefik ist auf dem k3s bereits vorhanden (siehe docs/setup.md), es braucht
# keinen zusaetzlichen Ingress-Controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serving-api
  labels:
    app.kubernetes.io/name: serving-api
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  name: http
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: serving-api
                port:
                  name: http
