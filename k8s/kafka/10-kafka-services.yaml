# SCRUM-73 — zwei Services mit unterschiedlicher Aufgabe.
#
# kafka-headless: clusterIP None. Gibt jedem Pod einen stabilen eigenen DNS-Namen
# (kafka-0.kafka-headless, kafka-1...). Kafka-Clients muessen einen einzelnen Broker
# gezielt erreichen koennen, weil jede Partition genau einen Leader hat — ein
# load-balancender Service wuerde die Verbindung auf einen beliebigen Broker legen
# und der Client bekaeme "not leader for partition".
#
# kafka: normaler ClusterIP-Service, dient nur als Bootstrap-Adresse. Der Client
# fragt hier einmal die Cluster-Metadaten ab und verbindet sich danach ueber die
# advertised listeners direkt mit den einzelnen Pods.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  # Broker muessen sich waehrend der Quorum-Bildung schon finden, bevor sie ready sind.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
