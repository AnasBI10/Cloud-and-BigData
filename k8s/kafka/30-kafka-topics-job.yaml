# SCRUM-76 — Topics deklarativ anlegen statt per auto.create.
#
# Auto-Create wuerde jedes Topic mit den Broker-Defaults erzeugen. Damit waere die
# Partitionszahl ein Zufallsprodukt und die Skalierungsgrenze der Consumer haette
# keine Begruendung. Der Job legt sie explizit an; Begruendung der Zahlen steht in
# docs/topics-und-partitionierung.md.
#
# idempotent: --if-not-exists, der Job kann bei jedem helm upgrade mitlaufen.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    app.kubernetes.io/name: kafka
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.9.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BS="kafka:9092"

              echo "warte auf Broker..."
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$BS" >/dev/null 2>&1; do
                sleep 5
              done

              create () {
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" --create --if-not-exists \
                  --topic "$1" --partitions "$2" --replication-factor 3 \
                  --config min.insync.replicas=2 --config "retention.ms=$3"
              }

              # Verkehrsmessungen, Key = link_id. 12 Partitionen = Obergrenze der
              # Consumer-Parallelitaet fuer den Skalierungsnachweis (SCRUM-93).
              create traffic.speeds.raw 12 604800000

              # Wetter, Key = borough. Nur 5 Keys, mehr als 5 Partitionen waeren
              # garantiert leer. Gehoert fachlich zu Victors Wetter-Poller.
              create weather.observations.raw 5 604800000

              # Dead Letter Queue fuer Records, die gegen das Avro-Schema fallen.
              create traffic.speeds.dlq 3 1209600000

              echo "--- angelegte Topics ---"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" --describe
